name: Bi-Weekly Model Retraining

on:
  schedule:
    # Runs at 05:00 UTC on the 1st and 15th of every month
    - cron: '0 5 1,15 * *'
  workflow_dispatch: # Allows manual retraining

jobs:
  run-retraining:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Model Retraining Pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "🚀 Starting bi-weekly model retraining pipeline..."
          python -u src/train.py --full
          
      - name: Commit and Push New Models
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git commit -m "Auto-retrained models [skip ci]" || echo "No changes to commit"
          git push
